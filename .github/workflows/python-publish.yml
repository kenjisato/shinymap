name: Publish Python Package

on:
  push:
    tags:
      - 'v*'
  # tag-on-merge.yml pushes tags with GITHUB_TOKEN, which does not trigger
  # `push` workflows, so it dispatches this workflow on the tag instead.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Run from the repo root: it is a uv workspace, so `uv build` writes to
      # the workspace's dist/ wherever it is invoked.
      - name: Build package
        run: uv build --package shinymap

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shinymap
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
